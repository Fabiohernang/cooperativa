<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Cooperativa</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--gris1);
    }
    .login-box {
      background: var(--gris2);
      border: 1px solid var(--gris3);
      border-radius: 10px;
      padding: 48px 40px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .login-logo { font-size: 40px; text-align:center; margin-bottom: 8px; }
    .login-title { font-size: 20px; font-weight: 700; color: var(--blanco); text-align:center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--gris5); text-align:center; margin-bottom: 32px; }
    .login-box label { color: var(--gris5); }
    .login-box input {
      background: var(--gris1);
      border-color: var(--gris3);
      color: var(--blanco);
      margin-bottom: 14px;
    }
    .login-box input:focus { border-color: var(--azul2); }
    .btn-ingresar {
      width: 100%;
      padding: 12px;
      background: var(--azul2);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--sans);
      transition: background .15s;
      margin-top: 4px;
    }
    .btn-ingresar:hover { background: var(--azul); }
    .btn-ingresar:disabled { opacity: .5; cursor: not-allowed; }
    .login-error {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(220,38,38,.15);
      border: 1px solid rgba(220,38,38,.3);
      border-radius: var(--radius);
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-logo">🚛</div>
  <div class="login-title">Sistema de Control</div>
  <div class="login-sub">Cooperativa de Transporte</div>

  <div class="form-group">
    <label>Usuario</label>
    <input type="text" id="input-usuario" placeholder="tu usuario" autocomplete="username" onkeydown="if(event.key==='Enter')ingresar()">
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="input-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">
  </div>

  <button class="btn-ingresar" id="btn-login" onclick="ingresar()">Ingresar</button>
  <div class="login-error" id="login-error"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeQfS11TFpuS0eQw_wTPcRFD4ZJ6dbRSE",
    authDomain: "cooperativa-transport.firebaseapp.com",
    projectId: "cooperativa-transport",
    storageBucket: "cooperativa-transport.firebasestorage.app",
    messagingSenderId: "809291027400",
    appId: "1:809291027400:web:cce398fd9d100e5287e6fd"
  };

  // ── USUARIOS: usuario → email interno de Firebase ──────
  // No son emails reales, son solo la forma en que Firebase
  // guarda las cuentas internamente. El usuario escribe
  // "fabio" y "1234" — Firebase lo traduce solo.
  const USUARIOS = {
    "fabio": "fabio@coop-transport.local",
    "juan":  "juan@coop-transport.local",
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Si ya está logueado, redirigir
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'index.html';
  });

  window.ingresar = async function() {
    const usuario = document.getElementById('input-usuario').value.trim().toLowerCase();
    const pass    = document.getElementById('input-pass').value;
    const btn     = document.getElementById('btn-login');
    const err     = document.getElementById('login-error');

    err.style.display = 'none';

    if (!usuario || !pass) {
      err.textContent = '⚠️ Completá usuario y contraseña.';
      err.style.display = 'block'; return;
    }
    if (!USUARIOS[usuario]) {
      err.textContent = '⚠️ Usuario incorrecto.';
      err.style.display = 'block'; return;
    }

    btn.disabled = true;
    btn.textContent = 'Ingresando…';

    try {
      await signInWithEmailAndPassword(auth, USUARIOS[usuario], pass);
      window.location.href = 'index.html';
    } catch(e) {
      let msg = 'Contraseña incorrecta.';
      if (e.code === 'auth/user-not-found') msg = 'Usuario no registrado aún. Contactá al admin.';
      err.textContent = '⚠️ ' + msg;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  };
</script>
</body>
</html>
