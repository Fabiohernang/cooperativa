<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Cooperativa</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--gris1);
    }
    .login-box {
      background: var(--gris2);
      border: 1px solid var(--gris3);
      border-radius: 10px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .login-logo {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--blanco);
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--gris5);
      margin-bottom: 36px;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 20px;
      background: var(--blanco);
      color: var(--gris1);
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--sans);
      transition: background .15s, transform .1s;
    }
    .btn-google:hover { background: var(--gris7); transform: translateY(-1px); }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
    .login-error {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(220,38,38,.15);
      border: 1px solid rgba(220,38,38,.3);
      border-radius: var(--radius);
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
    .login-loading {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gris5);
      display: none;
    }
    .login-footer {
      margin-top: 32px;
      font-size: 11px;
      color: var(--gris4);
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-logo">🚛</div>
  <div class="login-title">Sistema de Control</div>
  <div class="login-sub">Cooperativa de Transporte</div>

  <button class="btn-google" onclick="ingresar()" id="btn-login">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Ingresar con Google
  </button>

  <div class="login-error" id="login-error"></div>
  <div class="login-loading" id="login-loading">⏳ Verificando acceso...</div>

  <div class="login-footer">
    Solo usuarios autorizados pueden acceder.<br>
    Si no podés entrar, contactá al administrador.
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeQfS11TFpuS0eQw_wTPcRFD4ZJ6dbRSE",
    authDomain: "cooperativa-transport.firebaseapp.com",
    projectId: "cooperativa-transport",
    storageBucket: "cooperativa-transport.firebasestorage.app",
    messagingSenderId: "809291027400",
    appId: "1:809291027400:web:cce398fd9d100e5287e6fd"
  };

  const AUTORIZADOS = [
    "fabiohernang@gmail.com",
    // mail de Juan acá
  ];

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Si ya está logueado, redirigir directo
  onAuthStateChanged(auth, user => {
    if (user && AUTORIZADOS.includes(user.email)) {
      window.location.href = 'index.html';
    }
  });

  window.ingresar = async function() {
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-error');
    const load= document.getElementById('login-loading');
    btn.disabled = true;
    err.style.display = 'none';
    load.style.display = 'block';
    try {
      const result = await signInWithPopup(auth, provider);
      const email  = result.user.email;
      if (!AUTORIZADOS.includes(email)) {
        await auth.signOut();
        throw new Error(`${email} no tiene acceso. Contactá al administrador.`);
      }
      window.location.href = 'index.html';
    } catch(e) {
      err.textContent = '⚠️ ' + (e.message || 'Error al ingresar');
      err.style.display = 'block';
      load.style.display = 'none';
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
