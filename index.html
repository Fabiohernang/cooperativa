<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Cooperativa</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
    .venc-item { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-radius:var(--radius); border:1px solid var(--gris6); margin-bottom:8px; background:var(--blanco); }
    .venc-cliente { font-weight:600; font-size:13px; }
    .venc-dias { font-size:11px; color:var(--rojo2); font-family:var(--mono); }
    .venc-monto { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--rojo2); }
    .resumen-mes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .mes-item { text-align:center; padding:14px; background:var(--gris8); border-radius:var(--radius); border:1px solid var(--gris6); }
    .mes-item .valor { font-family:var(--mono); font-size:16px; font-weight:600; }
    .mes-item .etiq { font-size:11px; color:var(--gris4); text-transform:uppercase; letter-spacing:.04em; margin-top:4px; }
    .actividad-item { padding:8px 12px; border-left:3px solid var(--gris6); margin-bottom:8px; font-size:12px; }
    .actividad-item.viaje { border-color:var(--verde2); }
    .actividad-item.factura { border-color:var(--azul2); }
    .actividad-item.pago { border-color:var(--naranja2); }
    .actividad-fecha { color:var(--gris4); font-size:11px; }
    .loading { text-align:center; padding:40px; color:var(--gris4); }
    .nav-user-btn { background:var(--gris2); border:1px solid var(--gris3); color:var(--gris5); font-size:12px; padding:4px 10px; border-radius:var(--radius); display:flex; align-items:center; gap:8px; }
    .btn-logout { background:none; border:none; cursor:pointer; color:var(--gris5); font-size:12px; padding:4px 8px; border-radius:4px; }
    .btn-logout:hover { color:var(--rojo2); }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">🚛 COOP<span>/transport</span></div>
  <a href="index.html" class="active"><span class="nav-icon">📊</span> Dashboard</a>
  <a href="pages/viajes.html"><span class="nav-icon">📋</span> Viajes</a>
  <a href="pages/facturas.html"><span class="nav-icon">🧾</span> Facturas</a>
  <a href="pages/pagos.html"><span class="nav-icon">💸</span> Pagos</a>
  <a href="pages/conciliacion.html"><span class="nav-icon">✅</span> Conciliación</a>
  <a href="pages/analisis.html"><span class="nav-icon">📈</span> Análisis</a>
  <a href="pages/recibo.html"><span class="nav-icon">🖨️</span> Recibo</a>
  <div class="nav-spacer"></div>
  <div class="nav-user-btn">
    <span id="nav-user">…</span>
    <button class="btn-logout" onclick="doLogout()" title="Salir">⏻</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">📊 Dashboard <span class="badge" id="mes-actual">—</span></div>
      <div class="page-sub">Resumen general · datos en tiempo real</div>
    </div>
  </div>
  <div id="contenido"><div class="loading">⏳ Cargando datos...</div></div>
</div>

<script type="module" src="js/nav.js"></script>
<script>
const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ahora = new Date();
document.getElementById('mes-actual').textContent = meses[ahora.getMonth()] + ' ' + ahora.getFullYear();

window.addEventListener('auth-ready', async () => {
  const HOY = hoy();
  const mesN = ahora.getMonth()+1, anioN = ahora.getFullYear();

  const [viajes, facturas, pagos] = await Promise.all([
    DB.Viajes.getAll(), DB.Facturas.getAll(), DB.Pagos.getAll()
  ]);

  const vencidas = facturas.filter(f => !f.pagada && !f.anulada && f.fechaVenc && f.fechaVenc < HOY);
  const pendientes = facturas.filter(f => !f.pagada && !f.anulada);
  const totalPendiente = pendientes.reduce((a,f)=>a+(f.restante||0),0);
  const totalVencido   = vencidas.reduce((a,f)=>a+(f.restante||0),0);
  const totalPagado    = pagos.reduce((a,p)=>a+(p.impPagado||0),0);
  const viajesMes = viajes.filter(v => v.fecha && v.fecha.startsWith(`${anioN}-${String(mesN).padStart(2,'0')}`));
  const factMes   = viajesMes.reduce((a,v)=>a+(v.importeIVA||0),0);
  const cobradoMes= facturas.filter(f=>f.fechaPago&&f.fechaPago.startsWith(`${anioN}-${String(mesN).padStart(2,'0')}`)).reduce((a,f)=>a+(f.pago||0),0);
  const pagadoMes = pagos.filter(p=>p.fechaOP&&p.fechaOP.startsWith(`${anioN}-${String(mesN).padStart(2,'0')}`)).reduce((a,p)=>a+(p.impPagado||0),0);
  const comisionMes = viajesMes.reduce((a,v)=>a+(v.comision||0),0);

  document.getElementById('contenido').innerHTML = `
    ${totalVencido>0?`<div class="alert danger mb-24">⚠️ Tenés <strong>${vencidas.length} factura${vencidas.length>1?'s':''} vencida${vencidas.length>1?'s':''}</strong> sin cobrar por <strong>$${fmt(totalVencido)}</strong>.</div>`:''}
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
      <div class="kpi rojo"><div class="kpi-label">Saldo Vencido</div><div class="kpi-value rojo">$${fmt(totalVencido)}</div><div class="kpi-sub">${vencidas.length} facturas</div><div class="kpi-icon">⚠️</div></div>
      <div class="kpi azul"><div class="kpi-label">Total Pendiente Cobro</div><div class="kpi-value">$${fmt(totalPendiente)}</div><div class="kpi-sub">${pendientes.length} facturas</div><div class="kpi-icon">🧾</div></div>
      <div class="kpi naranja"><div class="kpi-label">Pagado a Fleteros</div><div class="kpi-value">$${fmt(totalPagado)}</div><div class="kpi-sub">${pagos.length} órdenes</div><div class="kpi-icon">💸</div></div>
      <div class="kpi verde"><div class="kpi-label">Facturado Este Mes</div><div class="kpi-value">$${fmt(factMes)}</div><div class="kpi-sub">${viajesMes.length} viajes</div><div class="kpi-icon">📋</div></div>
    </div>
    <div class="dash-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">⚠️ Facturas Vencidas sin Cobrar</div>
          <a href="pages/facturas.html" class="btn btn-ghost btn-sm">Ver todas →</a>
        </div>
        <div class="card-body">
          ${vencidas.length===0
            ? '<div class="empty-state"><div class="icon">✅</div><p>Sin facturas vencidas</p></div>'
            : vencidas.sort((a,b)=>a.fechaVenc<b.fechaVenc?-1:1).slice(0,8).map(f=>{
                const dias = Math.floor((new Date(HOY)-new Date(f.fechaVenc))/86400000);
                return `<div class="venc-item">
                  <div><div class="venc-cliente">${f.cliente} <span style="color:var(--gris4);font-weight:400">Fact. ${f.nro}</span></div>
                  <div class="venc-dias">${dias} día${dias!==1?'s':''} vencida · Venc: ${fmtFecha(f.fechaVenc)}</div></div>
                  <div class="venc-monto">$${fmt(f.restante)}</div>
                </div>`;
              }).join('')
          }
        </div>
      </div>
      <div>
        <div class="card mb-16">
          <div class="card-header"><div class="card-title">📅 Este mes</div></div>
          <div class="card-body">
            <div class="resumen-mes">
              <div class="mes-item"><div class="valor">$${fmt(factMes)}</div><div class="etiq">Facturado</div></div>
              <div class="mes-item"><div class="valor" style="color:var(--verde2)">$${fmt(cobradoMes)}</div><div class="etiq">Cobrado</div></div>
              <div class="mes-item"><div class="valor" style="color:var(--naranja2)">$${fmt(pagadoMes)}</div><div class="etiq">Pagado Flet.</div></div>
              <div class="mes-item"><div class="valor">$${fmt(comisionMes)}</div><div class="etiq">Comisión</div></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">🕐 Actividad reciente</div></div>
          <div class="card-body">
            ${[
              ...viajes.slice(0,3).map(v=>({tipo:'viaje', txt:`Viaje · ${v.fletero} · Fact. ${v.factura||'sin factura'}`})),
              ...facturas.slice(0,2).map(f=>({tipo:'factura', txt:`Factura ${f.nro} · ${f.cliente} · $${fmt(f.saldo)}`})),
              ...pagos.slice(0,2).map(p=>({tipo:'pago', txt:`Pago OP${p.nroOrden} · ${p.fletero} · $${fmt(p.impPagado)}`})),
            ].slice(0,6).map(t=>`<div class="actividad-item ${t.tipo}"><div>${t.txt}</div></div>`).join('')
            || '<div class="empty-state"><div class="icon">📭</div><p>Sin registros aún</p></div>'}
          </div>
        </div>
      </div>
    </div>
  `;
});
</script>
</body>
</html>
